[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admiral_detector"
version = "0.1.0"
description = "Detect Admiral anti-adblock domains"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.25.0",
    "tldextract>=3.4.0",
    "dnspython>=2.3.0"
]

[project.scripts]
admiral-detector = "admiral_detector.cli:main"
admiral-detector-setup = "admiral_detector.setup_cli:main"
admiral-pihole-sync = "admiral_detector.pihole.sync:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
admiral_detector = [
    "data/systemd/*",
    "data/integrations/pihole/*",
]
