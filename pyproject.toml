[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admiral_detector"
version = "1.2.0"
description = "Proactive detector for Admiral/Leven Labs dynamic anti-adblock domains."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.25.0",
    "tldextract>=3.4.0",
    "dnspython>=2.3.0"
]

[project.scripts]
admiral-detector = "admiral_detector.cli:main"
